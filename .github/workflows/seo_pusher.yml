name: Daily SEO Pusher

on:
  push:
    paths:
      - 'seo_pusher.py'
      - 'tests/test_seo_pusher.py'
      - '.github/workflows/seo_pusher.yml'
  pull_request:
    paths:
      - 'seo_pusher.py'
      - 'tests/test_seo_pusher.py'
      - '.github/workflows/seo_pusher.yml'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      submit_indexnow:
        description: 'Notify IndexNow for changed, validated core guides'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: seo-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Offline regression tests
        run: python -m unittest discover -s tests -p 'test_seo_pusher.py' -v

  seo_push:
    needs: verify
    # Code pushes and PRs only test; they must never notify a production service.
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Restore last accepted content fingerprints
        uses: actions/cache/restore@v4
        with:
          path: .seo/state.json
          key: seo-core-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: seo-core-v1-
      - name: Check source and optionally notify IndexNow
        id: health
        env:
          SUBMIT_INDEXNOW: ${{ github.event_name == 'schedule' || inputs.submit_indexnow }}
        shell: bash
        run: |
          args=()
          if [ "$SUBMIT_INDEXNOW" = "true" ]; then
            args+=(--submit-indexnow)
          fi
          python seo_pusher.py "${args[@]}" --state-file .seo/state.json --report-file .seo/report.json
      - name: Preserve accepted submission state
        if: success() && (github.event_name == 'schedule' || inputs.submit_indexnow)
        uses: actions/cache/save@v4
        with:
          path: .seo/state.json
          key: seo-core-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Confirm this run's state was saved
        id: ledger_check
        if: success() && (github.event_name == 'schedule' || inputs.submit_indexnow)
        uses: actions/cache/restore@v4
        with:
          path: .seo/state.json
          key: seo-core-v1-${{ github.run_id }}-${{ github.run_attempt }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Record state persistence result
        if: always() && steps.health.outcome == 'success'
        env:
          SUBMIT_INDEXNOW: ${{ github.event_name == 'schedule' || inputs.submit_indexnow }}
          STATE_CONFIRMED: ${{ steps.ledger_check.outputs.cache-hit == 'true' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          path = Path('.seo/report.json')
          report = json.loads(path.read_text())
          if os.environ['SUBMIT_INDEXNOW'] != 'true':
              report['state_persistence'] = 'not_requested'
          elif os.environ['STATE_CONFIRMED'] == 'true':
              report['state_persistence'] = 'confirmed_for_this_run'
          else:
              report.update(status='error', error_code='state_cache_unconfirmed',
                            failed_phase='state_cache', state_persistence='unconfirmed')
          path.write_text(json.dumps(report, indent=2) + '\n')
          if report['status'] == 'error':
              sys.exit(1)
          PY
      - name: Retain health evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: .seo/report.json
          if-no-files-found: warn
          retention-days: 30
